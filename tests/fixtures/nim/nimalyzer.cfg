# Sample nimalyzer configuration for catseye testing
# See: https://github.com/thindil/nimalyzer

# Source files to check
files tests/fixtures/nim/*.nim

# Verbosity
verbosity lvlNotice

# Check rules
check hasPragma procedures contractual "raises: [*"
explanation All procedures should declare their exception contracts.

check complexity all 40
explanation High cyclomatic complexity makes code hard to maintain.

check hasDoc all
explanation Public declarations should have documentation.

check varDeclared full
explanation Variables should declare both type and value.

check ifStatements all
explanation Empty if statements and negative conditions should be avoided.

check forStatements empty
explanation Empty for statements are dead code.

check localHides
explanation Local declarations should not shadow parent declarations.

check not ranges spaces
explanation Follow Nim coding style: no spaces around .. operator.

check assignments shorthand
explanation Use shorthand assignments when possible.

check caseStatements min 3
explanation Short case statements should be replaced with if statements.

check not trystatements empty
explanation Except branches should specify exception types.
