schema: spec-driven

context: |
  Finding.t already has `suggestion : string option` field (added in L3).
  KDL rules define sinks with `arg=N` position matching.
  Template substitution exists in `interpreter.ml` (`substitute_template`).
  Output formats: terminal, JSON, SARIF, markdown, DOT.

rules:
  proposal:
    - Include motivation and what class of FPs it fixes
    - Reference the IL/CFG refactor planning doc for dataflow changes
  tasks:
    - Each task should be completable in under 2 hours
    - Include file paths for new modules
    - Specify which test corpus to verify against
  spec:
    - Include type signatures for new OCaml modules
    - Reference existing module names for context

changes:
  autofix-suggestions:
    status: complete
    priority: P1
    files:
      - src/ocaml/lib/catseye_rules/types.ml (update: add fix field to sink_def)
      - src/ocaml/lib/catseye_rules/loader.ml (update: parse fix from KDL)
      - src/ocaml/lib/catseye_rules/interpreter.ml (update: populate suggestion from fix template)
      - src/ocaml/lib/catseye_types/finding.ml (update: suggestion field already exists)
      - src/ocaml/lib/catseye_cli/orchestrator.ml (update: render suggestions in terminal)
      - src/ocaml/rules/*.kdl (update: add fix templates to sinks)
    specs:
      - specs/autofix/spec.md

  claws-ast-migration:
