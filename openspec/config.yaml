schema: spec-driven

context: |
  Finding.t already has `suggestion : string option` field (added in L3).
  KDL rules define sinks with `arg=N` position matching.
  Template substitution exists in `interpreter.ml` (`substitute_template`).
  Output formats: terminal, JSON, SARIF, markdown, DOT.

rules:
  proposal:
    - Include motivation and what class of FPs it fixes
    - Reference the IL/CFG refactor planning doc for dataflow changes
  tasks:
    - Each task should be completable in under 2 hours
    - Include file paths for new modules
    - Specify which test corpus to verify against
  spec:
    - Include type signatures for new OCaml modules
    - Reference existing module names for context

