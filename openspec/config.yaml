      - src/ocaml/lib/catseye_claws/extra_smells_ast.ml (new: AST-native smell detectors)
      - src/ocaml/lib/catseye_claws/concurrency_ast.ml (new: AST-native spawn/channel checks)
      - src/ocaml/lib/catseye_cli/orchestrator.ml (update: pass ASTs to Claws)
    specs:
