name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq bubblewrap curl 2>/dev/null || true
          curl -sL https://raw.githubusercontent.com/ocaml/opam/master/shell/install.sh | sh

      - name: Setup OCaml
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          opam init --disable-sandboxing --yes
          opam switch create . ocaml-base-compiler.5.4.1 --yes
          eval $(opam env)

      - name: Install npm packages
        run: npm install -g tree-sitter-cli

      - name: Build
        run: |
          eval $(opam env)
          opam install --deps-only -y .
          dune build --profile release
          mkdir -p bin
          cp _build/default/bin/main.exe bin/catseye-ocaml
          crystal build src/extractor/extractor.cr -o bin/catseye-crystal-extractor --release 2>/dev/null || true
          crystal build src/extractor/hierarchical_extractor.cr -o bin/catseye-hierarchical-extractor --release 2>/dev/null || true

      - name: Package
        run: |
          tar -czf catseye-linux-x86_64.tar.gz bin/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: catseye-linux-x86_64.tar.gz