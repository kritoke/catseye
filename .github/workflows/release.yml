name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opam curl
          npm install -g tree-sitter-cli

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ocaml-base-compiler
          opam-depext: true

      - name: Build
        run: |
          opam install --deps-only -y .
          dune build --profile release
          mkdir -p bin
          cp _build/default/bin/main.exe bin/catseye-ocaml
          crystal build src/extractor/extractor.cr -o bin/catseye-crystal-extractor --release 2>/dev/null || true
          crystal build src/extractor/hierarchical_extractor.cr -o bin/catseye-hierarchical-extractor --release 2>/dev/null || true

      - name: Package
        run: |
          tar -czf catseye-linux-x86_64.tar.gz bin/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: catseye-linux-x86_64.tar.gz
