name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install opam and system deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl build-essential bubblewrap libsqlite3-dev m4
          curl -sL https://github.com/ocaml/opam/releases/download/2.2.0/opam-2.2.0-x86_64-linux -o /tmp/opam
          chmod +x /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam

      - name: Setup OCaml and build
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          
          # Initialize opam
          opam init --disable-sandboxing --auto-setup -y 2>/dev/null || true
          
          # Get environment
          eval $(opam env)
          
          # Install ALL dependencies needed for the project
          opam install -y dune ocamlfind menhir cmdliner yojson bos rresult logs fmt ocaml_sqlite3 ocamlgraph kdl toml sedlex ppx_deriving ppx_deriving_yojson 2>&1 | tail -40
          
          # cd to ocaml dir and build
          cd src/ocaml
          opam exec -- dune build --profile release
          mkdir -p ../../bin
          cp _build/default/bin/main.exe ../../bin/catseye-ocaml

      - name: Package
        run: tar -czf catseye-linux-x86_64.tar.gz bin/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: catseye-linux-x86_64.tar.gz