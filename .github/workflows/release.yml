name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl build-essential bubblewrap libsqlite3-dev m4
          curl -sL https://github.com/ocaml/opam/releases/download/2.2.0/opam-2.2.0-x86_64-linux -o /tmp/opam
          chmod +x /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam

      - name: Build
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          opam init --disable-sandboxing --auto-setup -y 2>&1 | grep -v darcs || true
          eval $(opam env)
          opam install -y dune ocamlfind menhir cmdliner yojson bos rresult logs fmt sqlite3 ocamlgraph kdl toml sedlex ppx_deriving ppx_deriving_yojson 2>&1 | tail -20
          cd src/ocaml && opam exec -- dune build --profile release
          mkdir -p ../../bin && cp _build/default/bin/main.exe ../../bin/catseye-ocaml

      - name: Create grammar installer
        run: |
          cat > install-grammars.sh << 'SCRIPT'
          #!/bin/bash
          # Install tree-sitter grammars for Catseye
          set -e

          GRAMMAR_DIR="${CATSEYE_GRAMMAR_DIR:-$HOME/.local/share/catseye/grammars}"
          mkdir -p "$GRAMMAR_DIR"

          echo "Installing tree-sitter grammars..."
          echo "Destination: $GRAMMAR_DIR"

          # Install grammars via npm packages
          # These packages contain pre-built .wasm parsers and .json schemas
          for lang in javascript typescript rust python go; do
            echo "  Installing $lang..."
            TMP=$(mktemp -d)
            if npm pack "@tree-sitter-grammars/tree-sitter-$lang" --pack-destination "$TMP" 2>/dev/null; then
              PKG=$(ls "$TMP"/tree-sitter-$lang-*.tgz 2>/dev/null | head -1)
              if [ -n "$PKG" ]; then
                mkdir -p "$GRAMMAR_DIR/tree-sitter-$lang"
                tar -xzf "$PKG" -C "$GRAMMAR_DIR/tree-sitter-$lang" --strip-components=1 2>/dev/null || true
              fi
            fi
            rm -rf "$TMP"
          done

          # Also try the official tree-sitter packages
          for lang in javascript typescript; do
            if [ ! -d "$GRAMMAR_DIR/tree-sitter-$lang" ]; then
              echo "  Installing $lang (official)..."
              TMP=$(mktemp -d)
              if npm pack "tree-sitter-$lang" --pack-destination "$TMP" 2>/dev/null; then
                PKG=$(ls "$TMP"/tree-sitter-$lang-*.tgz 2>/dev/null | head -1)
                if [ -n "$PKG" ]; then
                  mkdir -p "$GRAMMAR_DIR/tree-sitter-$lang"
                  tar -xzf "$PKG" -C "$GRAMMAR_DIR/tree-sitter-$lang" --strip-components=1 2>/dev/null || true
                fi
              fi
              rm -rf "$TMP"
            fi
          done

          echo ""
          echo "✓ Grammar installation complete"
          echo "  Location: $GRAMMAR_DIR"
          echo "  Set CATSEYE_GRAMMAR_DIR to customize"
          SCRIPT
          chmod +x install-grammars.sh

      - name: Package
        run: tar -czf catseye-linux-x86_64.tar.gz bin/ install-grammars.sh

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: catseye-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl gcc-aarch64-linux-gnu
          curl -sL https://github.com/ocaml/opam/releases/download/2.2.0/opam-2.2.0-x86_64-linux -o /tmp/opam
          chmod +x /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam

      - name: Build
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          opam init --disable-sandboxing --auto-setup -y 2>&1 | grep -v darcs || true
          eval $(opam env)
          opam install -y dune ocamlfind menhir cmdliner yojson bos rresult logs fmt sqlite3 ocamlgraph kdl toml sedlex ppx_deriving ppx_deriving_yojson 2>&1 | tail -20
          cd src/ocaml && opam exec -- dune build --profile release
          mkdir -p ../../bin && cp _build/default/bin/main.exe ../../bin/catseye-ocaml

      - name: Package
        run: |
          cp bin/catseye-ocaml bin/catseye-ocaml-aarch64
          tar -czf catseye-linux-aarch64.tar.gz bin/catseye-ocaml-aarch64

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: catseye-linux-aarch64.tar.gz

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13
            target: x86_64
            artifact: catseye-macos-x86_64
          - os: macos-14
            target: arm64
            artifact: catseye-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install opam
          opam init --disable-sandboxing --auto-setup -y 2>&1 | grep -v darcs || true

      - name: Build
        run: |
          eval $(opam env)
          opam install -y dune ocamlfind menhir cmdliner yojson bos rresult logs fmt sqlite3 ocamlgraph kdl toml sedlex ppx_deriving ppx_deriving_yojson 2>&1 | tail -20
          cd src/ocaml && opam exec -- dune build --profile release
          mkdir -p ../../bin && cp _build/default/bin/main.exe ../../bin/catseye-ocaml

      - name: Package
        run: tar -czf ${{ matrix.artifact }}.tar.gz bin/

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz
