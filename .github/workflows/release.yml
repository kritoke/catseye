name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install opam
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl build-essential bubblewrap
          curl -sL https://github.com/ocaml/opam/releases/download/2.2.0/opam-2.2.0-x86_64-linux -o /tmp/opam
          chmod +x /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam

      - name: Setup OCaml
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          opam init --disable-sandboxing --auto-setup -y
          opam switch create . ocaml-base-compiler.5.4.1 -y

      - name: Install npm packages
        run: npm install -g tree-sitter-cli

      - name: Build
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          eval $(opam env)
          opam install --deps-only -y .
          dune build --profile release
          mkdir -p bin
          cp _build/default/bin/main.exe bin/catseye-ocaml
          crystal build src/extractor/extractor.cr -o bin/catseye-crystal-extractor --release 2>/dev/null || true
          crystal build src/extractor/hierarchical_extractor.cr -o bin/catseye-hierarchical-extractor --release 2>/dev/null || true

      - name: Package
        run: |
          tar -czf catseye-linux-x86_64.tar.gz bin/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: catseye-linux-x86_64.tar.gz