name: Catseye Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y opam sqlite3 libsqlite3-dev pkg-config

      - name: Setup OCaml
        run: |
          opam init --disable-sandboxing --yes
          opam switch create 5.2.0 5.2.0 --yes
          eval $(opam env)

      - name: Install OCaml Packages
        run: |
          eval $(opam env)
          opam install -y dune yojson cmdliner bos rresult logs fmt toml kdl ocamlgraph sqlite3 alcotest --yes

      - name: Build Catseye
        run: |
          eval $(opam env)
          cd src/ocaml
          dune build --profile release
          cp _build/default/bin/main.exe ../../bin/catseye

      - name: Run Security Scan
        run: |
          ./bin/catseye --rules src/ocaml/rules --format sarif . > catseye-results.sarif

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: catseye-results.sarif
          category: catseye