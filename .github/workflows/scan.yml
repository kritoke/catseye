name: Catseye Security Scan

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl build-essential bubblewrap libsqlite3-dev m4
          curl -sL https://github.com/ocaml/opam/releases/download/2.2.0/opam-2.2.0-x86_64-linux -o /tmp/opam
          chmod +x /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam

      - name: Setup OCaml
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          opam init --disable-sandboxing --auto-setup -y 2>&1 | grep -v darcs || true
          eval $(opam env)
          opam install -y dune ocamlfind menhir cmdliner yojson bos rresult logs fmt sqlite3 ocamlgraph kdl toml sedlex ppx_deriving ppx_deriving_yojson 2>&1 | tail -20

      - name: Build Catseye
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          eval $(opam env)
          cd src/ocaml
          dune build --profile release
          mkdir -p ../../bin
          cp _build/default/bin/main.exe ../../bin/catseye

      - name: Run Security Scan
        run: |
          ./bin/catseye --rules src/ocaml/rules --format sarif . > catseye-results.sarif 2>/tmp/scan-stderr.txt || true
          echo "Scan exit code: $?"
          cat /tmp/scan-stderr.txt || true

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('catseye-results.sarif') != ''
        with:
          sarif_file: catseye-results.sarif
          category: catseye
