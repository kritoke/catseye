name: Catseye Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build Catseye
        run: |
          nix develop --command bash -c '
            cd src/ocaml && dune build
            cp _build/default/bin/main.exe ../../bin/catseye-ocaml
          '

      - name: Run Security Scan
        run: |
          nix develop --command bash -c '
            bin/catseye-ocaml --rules src/ocaml/rules --format sarif . > catseye-results.sarif
          '

      - name: Upload SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: catseye-results.sarif
          category: catseye
