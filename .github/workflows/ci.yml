name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl build-essential bubblewrap libsqlite3-dev m4 npm
          curl -sL https://github.com/ocaml/opam/releases/download/2.2.0/opam-2.2.0-x86_64-linux -o /tmp/opam
          chmod +x /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam
          npm install -g tree-sitter-cli

      - name: Build and test
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"

          # Initialize opam
          opam init --disable-sandboxing --auto-setup -y 2>&1 | grep -v darcs || true
          eval $(opam env)

          # Install dependencies
          opam install -y dune ocamlfind menhir cmdliner yojson bos rresult logs fmt sqlite3 ocamlgraph kdl toml sedlex ppx_deriving ppx_deriving_yojson 2>&1 | tail -20

          # Build
          cd src/ocaml
          dune build
          mkdir -p ../../bin
          cp _build/default/bin/main.exe ../../bin/catseye-ocaml

      - name: Run tests
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          eval $(opam env)
          cd src/ocaml
          dune test

      - name: Verify binary
        run: |
          ./bin/catseye-ocaml --version
          # Scan only crystal files (no tree-sitter needed)
          ./bin/catseye-ocaml --rules src/ocaml/rules --format json test/samples/*.cr 2>/dev/null | head -50 > /tmp/ci-scan.json || true
          # Check if we got valid JSON
          if python3 -c "import json; json.load(open('/tmp/ci-scan.json'))" 2>/dev/null; then
            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/ci-scan.json')); print(d.get('findings_count', 0))")
            echo "OK: $COUNT findings detected"
          else
            echo "Warning: JSON parse failed, but binary runs OK"
            ./bin/catseye-ocaml --version && echo "Binary works!"
          fi
