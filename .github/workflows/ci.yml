name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq curl build-essential bubblewrap libsqlite3-dev m4
          curl -sL https://github.com/ocaml/opam/releases/download/2.2.0/opam-2.2.0-x86_64-linux -o /tmp/opam
          chmod +x /tmp/opam
          sudo mv /tmp/opam /usr/local/bin/opam

      - name: Build and test
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          
          # Initialize opam
          opam init --disable-sandboxing --auto-setup -y 2>&1 | grep -v darcs || true
          eval $(opam env)
          
          # Install dependencies
          opam install -y dune ocamlfind menhir cmdliner yojson bos rresult logs fmt sqlite3 ocamlgraph kdl toml sedlex ppx_deriving ppx_deriving_yojson 2>&1 | tail -20
          
          # Build
          cd src/ocaml
          dune build
          mkdir -p ../../bin
          cp _build/default/bin/main.exe ../../bin/catseye-ocaml

      - name: Run tests
        run: |
          export OPAMROOT=/home/runner/.opam
          export PATH="$OPAMROOT/bin:$PATH"
          eval $(opam env)
          cd src/ocaml
          dune test

      - name: Verify binary
        run: |
          ./bin/catseye-ocaml --version
          ./bin/catseye-ocaml --rules src/ocaml/rules --format json test/samples/ > /tmp/ci-scan.json
          COUNT=$(python3 -c "import json; d=json.load(open('/tmp/ci-scan.json')); print(d['findings_count'])")
          if [ "$COUNT" -lt 10 ]; then
            echo "ERROR: Expected >= 10 findings, got $COUNT"
            exit 1
          fi
          echo "OK: $COUNT findings detected"