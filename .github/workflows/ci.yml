name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq opam tree-sitter

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          opam-pin: false

      - name: Build
        run: |
          opam install --deps-only -y .
          cd src/ocaml && dune build
          mkdir -p bin
          cp _build/default/bin/main.exe ../../bin/catseye-ocaml
          crystal build src/extractor/extractor.cr -o ../../bin/catseye-crystal-extractor --release 2>/dev/null || true

      - name: Run Tests
        run: |
          cd src/ocaml && dune test

      - name: Verify Binary Works
        run: |
          ./bin/catseye-ocaml --version
          ./bin/catseye-ocaml --rules src/ocaml/rules --format json test/samples/ > /tmp/ci-scan.json

      - name: Verify Findings
        run: |
          COUNT=$(python3 -c "import json; d=json.load(open('/tmp/ci-scan.json')); print(d['findings_count'])")
          if [ "$COUNT" -lt 10 ]; then
            echo "ERROR: Expected >= 10 findings, got $COUNT"
            exit 1
          fi
          echo "OK: $COUNT findings detected"

      - name: Verify Safe Samples Clean
        run: |
          ./bin/catseye-ocaml --rules src/ocaml/rules --format json test/samples/safe_sql.cr > /tmp/safe-scan.json
          COUNT=$(python3 -c "import json; d=json.load(open('/tmp/safe-scan.json')); print(d['findings_count'])")
          if [ "$COUNT" -gt 0 ]; then
            echo "ERROR: Expected 0 findings for safe sample, got $COUNT"
            exit 1
          fi
          echo "OK: Safe sample clean ($COUNT findings)"
